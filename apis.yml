- aid: heroiclabs:hiro-api
  name: Hiro RPC API
  description: 'The Hiro RPC API is Heroic Labs'' game framework server interface
    exposing economy, progression, achievements, inventory, and social graph RPCs
    that run on the Nakama server runtime. It is available as an OAS 3.0 specification
    and is designed for authoritative server-to-server calls from game clients and
    backend services.

    '
