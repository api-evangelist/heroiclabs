aid: heroiclabs
name: Heroic Labs
description: 'Heroic Labs is the company behind Nakama, a leading open-source game
  backend server providing a comprehensive REST, WebSocket, and gRPC API for building
  scalable multiplayer and social games. The platform delivers essential backend services
  including real-time matchmaking, leaderboards, tournaments, chat, friend systems,
  and presence tracking. Nakama exposes its functionality via RESTful HTTP endpoints,
  real-time WebSocket connections, and gRPC, with server runtime support for custom
  logic in Go, TypeScript, and Lua. Heroic Labs also offers Heroic Cloud as a fully
  managed deployment platform and Satori as a LiveOps product for feature flags, A/B
  experiments, and live events.

  '
