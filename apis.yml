- aid: heroiclabs:satori-api
  name: Satori API
  description: 'The Satori API is Heroic Labs'' LiveOps platform API enabling game
    developers to manage live operations including feature flags, A/B experiments,
    audiences, and scheduled events without redeploying game code. It integrates tightly
    with Nakama and exposes REST endpoints for event ingestion, experiment assignment,
    audience segmentation, and flag evaluation. Satori is available as a fully managed
    service on Heroic Cloud starting at $600 per month.

    '
