apis:
- aid: heroiclabs:nakama-api
  name: Nakama API
  description: 'The Nakama API is the core REST and WebSocket API for Heroic Labs'' open-source game backend
    server. It provides endpoints for user authentication (social, device, email, and custom), account
    management, multiplayer matchmaking, real-time gameplay via WebSocket, leaderboards, tournaments,
    group and friend management, in-app notifications, storage, and remote procedure calls (RPC). The
    gRPC interface mirrors the HTTP API and is suited for server-to-server integrations. Client SDKs are
    available for Unity, Unreal Engine, Godot, JavaScript, Dart, Java, Swift, C++, and Defold.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
