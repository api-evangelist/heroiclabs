components:
  schemas:
    DeliveryResult:
      type: object
      properties:
        recipient_id:
          type: string
          description: The identity ID of the recipient.
        integration_results:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationResult'
          description: Results for each valid integration used in the delivery.
      description: Details of each delivery attempt.
    MatchState:
      type: object
      properties:
        presences:
          type: array
          items:
            $ref: '#/components/schemas/UserPresence'
          description: Presence list.
        tick:
          type: string
          format: int64
          description: Current tick number.
        state:
          type: string
          description: State.
      title: Match state
    rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Any'
    SendDirectMessageRequest:
      type: object
      properties:
        template_id:
          type: string
          description: The identifier of the template used to render the message content.
        identity_ids:
          type: array
          items:
            type: string
          description: A list of recipient identity IDs.
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/MessageIntegrationType'
          description: A list of integrations to use for sending the message.
        persist:
          type: boolean
          description: Whether the message should be stored in the recipient's inbox.
        channels:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MessageChannels'
          description: If applicable, channels to send this message through, per integration.
        template_override:
          $ref: '#/components/schemas/TemplateOverride'
      description: The request to send direct messages.
    api.Match:
      type: object
      properties:
        match_id:
          type: string
          description: The ID of the match, can be used to join.
        authoritative:
          type: boolean
          description: True if it's an server-managed authoritative match, false otherwise.
        label:
          type: string
          description: Match label, if any.
        size:
          type: integer
          format: int32
          description: Current number of users in the match.
        tick_rate:
          type: integer
          format: int32
          title: Tick Rate
        handler_name:
          type: string
          title: Handler name
      description: Represents a realtime match.
    SettingList:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
          description: A list of settings.
        acl_resources:
          type: array
          items:
            $ref: '#/components/schemas/AclResources'
          description: This field is only used to allow the swagger generator to output the enum values.
      description: A list of settings.
    StorageObjectAck:
      type: object
      properties:
        collection:
          type: string
          description: The collection which stores the object.
        key:
          type: string
          description: The key of the object within the collection.
        version:
          type: string
          description: The version hash of the object.
        user_id:
          type: string
          description: The owner of the object.
        create_time:
          type: string
          format: date-time
          description: The UNIX time (for gRPC clients) or ISO string (for REST clients) when the object was created.
        update_time:
          type: string
          format: date-time
          description: The UNIX time (for gRPC clients) or ISO string (for REST clients) when the object was last updated.
