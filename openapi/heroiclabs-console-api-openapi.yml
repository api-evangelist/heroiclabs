          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: id
        description: User to remove.
        in: path
        required: true
        schema:
          type: string
      - name: group_id
        description: ID of the group to remove them from.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{id}/import:
