openapi: 3.2.0
info:
  title: Heroiclabs Console API
  version: '2.0'
  contact:
    name: The Nakama Authors & Contributors
    url: https://github.com/heroiclabs/nakama
    email: hello@heroiclabs.com
  description: 'Operations tagged Console across 2 of this provider''s published API definitions: heroiclabs-nakama-console-api-openapi.yml, heroiclabs-nakama-console-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: http://127.0.0.1:7351
security:
- BearerJwt: []
tags:
- name: Console
paths:
  /v2/console/account:
    get:
      summary: List (and optionally filter) accounts.
      operationId: ListAccounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: filter
        description: User ID or username filter.
        in: query
        required: false
        schema:
          type: string
      - name: tombstones
        description: Search only recorded deletes.
        in: query
        required: false
        schema:
          type: boolean
      - name: cursor
        description: Cursor to start from
        in: query
        required: false
        schema:
          type: string
      tags:
      - Console
    delete:
      summary: Delete (non-recorded) all user accounts.
      operationId: DeleteAccounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      tags:
      - Console
    post:
      summary: Import given account export data, creating a new account that fully matches the data.
      operationId: ImportAccountFull
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/console.Account'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountImport'
        description: Request to import user account data.
        required: true
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{account_id}/note:
    get:
      operationId: ListAccountNotes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountNotesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: account_id
        description: Account to list notes for.
        in: path
        required: true
        schema:
          type: string
      - name: limit
        description: Response result page limit.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        description: Optional cursor for pagination.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Console
    post:
      operationId: AddAccountNote
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNote'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: account_id
        description: The account id to add the note for.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAccountNoteBody'
        required: true
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{account_id}/note/{note_id}:
    delete:
      operationId: DeleteAccountNote
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: account_id
        description: Account owning the notes.
        in: path
        required: true
        schema:
          type: string
      - name: note_id
        description: Identifier of the note.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{account_id}/wallet:
    get:
      summary: Get a list of the user's wallet transactions.
      operationId: GetWalletLedger
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLedgerList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: account_id
        description: The unique identifier of the user account.
        in: path
        required: true
        schema:
          type: string
      - name: limit
        description: Max number of results per page.
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        description: Cursor to retrieve a page of records from.
        in: query
        required: false
        schema:
          type: string
      - name: after
        description: Optional timestamp threshold to list wallet ledger records after.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        description: Optional timestamp threshold to list wallet ledger records before.
        in: query
        required: false
        schema:
          type: string
          format: date-time
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{id}:
    get:
      summary: Get detailed account information for a single user.
      operationId: GetAccount
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/console.Account'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: id
        description: The unique identifier of the user account.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Console
    delete:
      summary: Delete all information stored for a user account.
      operationId: DeleteAccount
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: id
        description: The unique identifier of the user account.
        in: path
        required: true
        schema:
          type: string
      - name: record_deletion
        description: Record the user deletion - used for GDPR compliance.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Console
    post:
      summary: Update one or more fields on a user account.
      operationId: UpdateAccount
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: id
        description: User ID to update.
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBody'
        required: true
      tags:
      - Console
    servers:
    - url: http://127.0.0.1:7351
  /v2/console/account/{id}/ban:
    post:
      summary: Ban a user.
      operationId: BanAccount
      responses:
        '200':
